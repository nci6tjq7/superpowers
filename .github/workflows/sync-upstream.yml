name: Sync Upstream and Apply z.ai Adaptations

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if already up to date'
        required: false
        default: 'false'

jobs:
  sync-and-adapt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/obra/superpowers.git
          git fetch upstream

      - name: Check if upstream has changes
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "Already up to date with upstream"
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "Upstream has new commits"
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.up_to_date == 'false' || github.event.inputs.force == 'true'
        run: |
          git merge upstream/main --no-edit
          echo "Merged upstream/main into local main"

      - name: Apply z.ai adaptation patch
        if: steps.check.outputs.up_to_date == 'false' || github.event.inputs.force == 'true'
        run: |
          # Re-apply the z.ai adaptation changes after upstream merge.
          # This script modifies files to adapt Claude Code references for z.ai.
          
          echo "=== Applying z.ai adaptations ==="
          
          # 1. using-superpowers/SKILL.md
          if [ -f skills/using-superpowers/SKILL.md ]; then
            sed -i 's/<SUBAGENT-STOP>/<SUBAGENT-GUARD>/g' skills/using-superpowers/SKILL.md
            sed -i 's| CLAUDE.md, GEMINI.md, AGENTS.md, direct requests| AGENTS.md, direct requests|g' skills/using-superpowers/SKILL.md
            sed -i 's|If CLAUDE.md, GEMINI.md, or AGENTS.md says|If AGENTS.md says|g' skills/using-superpowers/SKILL.md
            echo "  Updated using-superpowers/SKILL.md"
          fi
          
          # 2. writing-skills/SKILL.md
          if [ -f skills/writing-skills/SKILL.md ]; then
            sed -i 's/Future Claude needs to FIND/Future agent instances need to FIND/g' skills/writing-skills/SKILL.md
            sed -i 's/Claude reads description to decide/The agent reads description to decide/g' skills/writing-skills/SKILL.md
            sed -i 's/Claude may follow the description/the agent may follow the description/g' skills/writing-skills/SKILL.md
            sed -i 's/Claude correctly read the flowchart/the agent correctly read the flowchart/g' skills/writing-skills/SKILL.md
            sed -i 's/Claude will take/the agent will take/g' skills/writing-skills/SKILL.md
            sed -i 's/Claude skips/the agent skips/g' skills/writing-skills/SKILL.md
            sed -i 's/Use words Claude would search for/Use words an agent would search for/g' skills/writing-skills/SKILL.md
            sed -i 's/How future Claude finds/How future agent instances find/g' skills/writing-skills/SKILL.md
            sed -i 's/future Claude instances/future agent instances/g' skills/writing-skills/SKILL.md
            sed -i 's/future Claude instances find/future agent instances find/g' skills/writing-skills/SKILL.md
            echo "  Updated writing-skills/SKILL.md"
          fi
          
          # 3. hooks/hooks.json
          if [ -f hooks/hooks.json ]; then
            sed -i 's|${CLAUDE_PLUGIN_ROOT}|${PLUGIN_ROOT}|g' hooks/hooks.json
            echo "  Updated hooks/hooks.json"
          fi
          
          # 4. receiving-code-review/SKILL.md
          if [ -f skills/receiving-code-review/SKILL.md ]; then
            sed -i 's/explicit CLAUDE.md violation/explicit instruction-file violation/g' skills/receiving-code-review/SKILL.md
            echo "  Updated receiving-code-review/SKILL.md"
          fi
          
          # 5. Ensure zai-tools.md exists
          if [ ! -f skills/using-superpowers/references/zai-tools.md ]; then
            cat > skills/using-superpowers/references/zai-tools.md << 'ZAI_TOOLS_EOF'
          # z.ai Tool Mapping
          # (Auto-generated by sync workflow - see .github/workflows/sync-upstream.yml)
          # Skills use Claude Code tool names as primary reference. On z.ai, most tools share the same names.
          ZAI_TOOLS_EOF
            echo "  Created zai-tools.md placeholder"
          fi
          
          echo "=== Adaptation complete ==="

      - name: Check for changes
        id: changes
        if: steps.check.outputs.up_to_date == 'false' || github.event.inputs.force == 'true'
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit (upstream already had adaptations)"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Commit and push adaptations
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: re-apply z.ai adaptations after upstream sync $(date +%Y-%m-%d)"
          git push origin main
          echo "Pushed z.ai adaptations to fork"
